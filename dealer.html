<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dealer Service</title>

  <style>
    :root {
      --aaa-blue: #003b8f;
      --aaa-red: #e2231a;
      --aaa-page: #e7f6fc;
      --aaa-text: #252a34;
      --aaa-muted: #66727d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--aaa-page);
      color: var(--aaa-text);
    }

    .page-content {
      flex: 1;
      padding: 14px;
    }

    .form-area {
      width: 520px;
      max-width: 100%;
    }

    .field {
      display: flex;
      flex-direction: column;
      margin-bottom: 8px;
    }

    label {
      margin-bottom: 3px;
      font-size: 14px;
      font-weight: bold;
    }

    input,
    textarea, select {
      width: 400px;
      max-width: 100%;
      padding: 6px;
      border: 2px solid #777777;
      border-radius: 4px;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
    }

    input, select {
      height: 30px;
    }

    textarea {
      height: 65px;
      resize: vertical;
    }

    .conditional-field {
      display: none;
    }

    .agent-info {
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.3;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    button {
      padding: 6px 10px;
      border: 1px solid #333333;
      border-radius: 4px;
      background: #e9e9e9;
      color: #000000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #d5d5d5;
    }

    #status {
      min-height: 18px;
      margin-top: 8px;
      font-size: 12px;
      font-weight: bold;
    }

    .copy-output-label {
      display: block;
      margin-top: 10px;
      margin-bottom: 3px;
      font-size: 14px;
      font-weight: bold;
    }

    #copyOutput {
      width: 400px;
      max-width: 100%;
      height: 140px;
      padding: 6px;
      border: 2px solid #777777;
      border-radius: 4px;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      resize: vertical;
    }

    .page-footer {
      padding: 18px 24px;
      color: var(--aaa-muted);
      background: var(--aaa-page);
      font-size: 12px;
      text-align: center;
    }

    .page-footer strong {
      color: var(--aaa-blue);
    }

    @media (max-width: 560px) {
      .page-content {
        padding: 10px;
      }

      input,
      textarea, select,
      #copyOutput {
        width: 100%;
      }

      .page-footer {
        padding: 14px 10px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <main class="page-content">
    <!-- START DEALER SECTION -->
    <form id="dealerForm" class="form-area" onsubmit="return false;">
      
      <div class="field" data-internal-id="issue">
        <label for="A">ISSUE:</label>
        <input type="text" id="A">
      </div>

      <div class="field" data-internal-id="troubleshooting">
        <label for="B">TROUBLESHOOTING STEPS:</label>
        <textarea id="B"></textarea>
      </div>

      <div class="field" data-internal-id="parts_needed">
        <label for="C">PARTS, IF NEEDED:</label>
        <input type="text" id="C">
      </div>

      <div class="field" data-internal-id="quoted_rate">
        <label for="D">QUOTED RATE FOR PARTS:</label>
        <input type="text" id="D">
      </div>

      <div class="field" data-internal-id="name_contact">
        <label for="E">NAME/CONTACT #:</label>
        <input type="text" id="E">
      </div>

      <div class="agent-info">
        AGENT: <span id="nameDisplay"></span>
        EXT: <span id="phoneDisplay"></span>
        DEPT: <span id="deptDisplay"></span>
      </div>

      <div class="buttons">
        <button type="button" onclick="copyForm()">
          COPY DEALER NOTE
        </button>

        <button type="button" onclick="clearForm()">
          CLEAR
        </button>
      </div>

      <div id="status"></div>

      <label
        id="copyOutputLabel"
        class="copy-output-label"
        for="copyOutput"
        style="display: none;"
      >
        GENERATED NOTE:
      </label>

      <textarea
        id="copyOutput"
        readonly
        style="display: none;"
        placeholder="Your generated Dealer Service note will appear here."
      ></textarea>
    </form>
    <!-- END DEALER SECTION -->
  </main>

  <footer class="page-footer">
    <strong>AAA Smart Home Security</strong>
    • Dealer Service Tool
    • Internal Use Only
  </footer>

  <script>
    const agent = localStorage.getItem('name') || '';
    const phone = localStorage.getItem('phone') || '';
    const dept = localStorage.getItem('dept') || '';

    document.getElementById('nameDisplay').textContent = agent;
    document.getElementById('phoneDisplay').textContent = phone;
    document.getElementById('deptDisplay').textContent = dept;

    google.script.url.getLocation(function (location) {
      const params = location.parameter;

      const nameContact = [
        params.noteName || '',
        params.cbr || ''
      ].filter(value => value !== '').join(' / ');

      document.getElementById('A').value = params.reason || '';
      document.getElementById('E').value = nameContact;
    });

    function getValue(id) {
      return document.getElementById(id).value.trim();
    }

    // ==========================================
    // DYNAMIC FORM SCHEMA LOGIC
    // ==========================================
    let formSchema = {};

    google.script.run.withSuccessHandler(function(schema) {
      formSchema = schema.dealer || {};
      
      const processField = (key, fieldData) => {
        const fieldEl = document.querySelector(`[data-internal-id="${key}"]`);
        if (!fieldEl) return;
        
        // 1. Update Label Text
        const labelEl = fieldEl.querySelector('label');
        if (labelEl) {
          for (let i = 0; i < labelEl.childNodes.length; i++) {
            if (labelEl.childNodes[i].nodeType === Node.TEXT_NODE && labelEl.childNodes[i].nodeValue.trim().length > 0) {
              labelEl.childNodes[i].nodeValue = fieldData.label + (fieldData.label.endsWith(':') ? '' : ': ');
              break;
            }
          }
        }

        // 2. Update Dropdown Options (if any exist)
        if (fieldData.type.toLowerCase() === 'dropdown' && fieldData.options) {
          const selectEl = fieldEl.querySelector('select');
          if (selectEl) {
            const firstOption = selectEl.options.length > 0 && selectEl.options[0].value === "" ? selectEl.options[0].outerHTML : '<option value="">Select...</option>';
            const newOptions = fieldData.options.split(',').map(opt => opt.trim());
            let optionsHtml = firstOption;
            newOptions.forEach(opt => { optionsHtml += `<option value="${opt}">${opt}</option>`; });
            selectEl.innerHTML = optionsHtml;
          }
        }
        
        // 3. Update Visibility
        const isVisible = fieldData.visible.toString().toUpperCase();
        if (isVisible === 'FALSE' || isVisible === 'NO') {
          fieldEl.style.display = 'none';
          fieldEl.classList.add('schema-hidden');
        } else {
          if (fieldEl.classList.contains('schema-hidden')) {
            fieldEl.style.display = 'flex'; 
            fieldEl.classList.remove('schema-hidden');
          }
        }
      };

      for (const key in formSchema) {
        processField(key, formSchema[key]);
      }
    }).getFormSchema();

    // Helper to grab dynamic labels for the copy output
    function getLabel(key, defaultLabel) {
      if (formSchema[key] && formSchema[key].label) {
        return formSchema[key].label.replace(/:$/, '').toUpperCase();
      }
      return defaultLabel;
    }

    // Helper to check visibility before copying
    function isFieldVisible(key) {
      if (formSchema[key]) {
        const vis = formSchema[key].visible.toString().toUpperCase();
        if (vis === 'FALSE' || vis === 'NO') return false;
      }
      return true;
    }

    function addLine(outputLines, label, value) {
      if (value) {
        outputLines.push(label + ': ' + value);
      }
    }

    async function copyForm() {
      const partsNeeded = getValue('C');
      const quotedRate = getValue('D');

      const outputLines = [];

      if (isFieldVisible('issue')) addLine(outputLines, getLabel('issue', 'ISSUE'), getValue('A'));
      if (isFieldVisible('troubleshooting')) addLine(outputLines, getLabel('troubleshooting', 'TROUBLESHOOTING STEPS'), getValue('B'));
      if (isFieldVisible('parts_needed')) addLine(outputLines, getLabel('parts_needed', 'PARTS, IF NEEDED'), partsNeeded);

      if (partsNeeded && isFieldVisible('quoted_rate')) {
        addLine(outputLines, getLabel('quoted_rate', 'QUOTED RATE FOR PARTS'), quotedRate);
      }

      if (isFieldVisible('name_contact')) addLine(outputLines, getLabel('name_contact', 'NAME/CONTACT #'), getValue('E'));
      
      addLine(outputLines, 'AGENT', agent);
      addLine(outputLines, 'EXT', phone);
      addLine(outputLines, 'DEPT', dept);

      const output = outputLines.join('\n');
      const status = document.getElementById('status');
      const copyOutput = document.getElementById('copyOutput');
      const copyOutputLabel = document.getElementById('copyOutputLabel');

      copyOutput.value = output;
      copyOutput.style.display = 'none';
      copyOutputLabel.style.display = 'none';

      try {
        await navigator.clipboard.writeText(output);

        status.style.color = '#188038';
        status.textContent = 'Dealer service note copied to clipboard.';
      } catch (error) {
        copyOutput.style.display = 'block';
        copyOutputLabel.style.display = 'block';
        copyOutput.focus();
        copyOutput.select();

        status.style.color = '#1a73e8';
        status.textContent =
          'Automatic copy was blocked. The note is selected below—press Ctrl + C.';
      }
    }

    function clearForm() {
      document.getElementById('dealerForm').reset();

      const status = document.getElementById('status');
      const copyOutput = document.getElementById('copyOutput');
      const copyOutputLabel = document.getElementById('copyOutputLabel');

      copyOutput.value = '';
      copyOutput.style.display = 'none';
      copyOutputLabel.style.display = 'none';

      if (
        window.parent !== window &&
        typeof window.parent.closeTicketPanel === 'function'
      ) {
        window.parent.closeTicketPanel();
        return;
      }

      status.style.color = '#188038';
      status.textContent = 'Dealer service fields cleared.';
    }
  </script>
</body>
</html>
