<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Note Taker</title>

  <style>
    :root {
      --aaa-blue: #003b8f;
      --aaa-blue-dark: #002d6a;
      --aaa-red: #e2231a;
      --aaa-page: #e7f6fc;
      --aaa-card: #ffffff;
      --aaa-text: #252a34;
      --aaa-muted: #66727d;
      --aaa-border: #c8dce7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--aaa-page);
      color: var(--aaa-text);
    }

    .aaa-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
      padding: 18px 30px;
      color: #ffffff;
      background: var(--aaa-blue);
      border-bottom: 5px solid var(--aaa-red);
      box-shadow: 0 3px 12px rgba(0, 45, 106, 0.20);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .aaa-logo {
      width: 175px;
      min-width: 175px;
      max-height: 82px;
      object-fit: contain;
    }

    .header-text h1 {
      margin: 0;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 36px;
      line-height: 1.05;
    }

    .header-text p {
      margin: 8px 0 0;
      color: rgba(255, 255, 255, 0.84);
      font-size: 18px;
    }

    .header-status {
      min-width: 195px;
      padding: 12px 15px;
      color: rgba(255, 255, 255, 0.86);
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 12px;
      font-size: 14px;
      text-align: right;
    }

    .header-status strong {
      display: block;
      margin-top: 4px;
      color: #ffffff;
      font-size: 16px;
    }

    .page-content {
      flex: 1;
      padding: 30px 14px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      margin: 30px auto;
      padding: 24px;
      border-top: 6px solid var(--aaa-red);
      border-right: 1px solid var(--aaa-border);
      border-bottom: 1px solid var(--aaa-border);
      border-left: 1px solid var(--aaa-border);
      border-radius: 10px;
      background: var(--aaa-card);
      box-shadow: 0 8px 25px rgba(0, 59, 143, 0.14);
    }

    .container h2 {
      margin: 0;
      color: var(--aaa-blue);
      font-size: 24px;
      text-align: center;
    }

    .subtitle {
      margin: 8px 0 22px;
      color: var(--aaa-muted);
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 4px;
      color: var(--aaa-blue);
      font-size: 13px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      height: 38px;
      padding: 7px 9px;
      border: 1px solid var(--aaa-border);
      border-radius: 5px;
      box-sizing: border-box;
      background: #ffffff;
      color: var(--aaa-text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--aaa-blue);
      box-shadow: 0 0 0 3px rgba(0, 59, 143, 0.12);
    }

    button {
      width: 100%;
      min-height: 40px;
      padding: 9px 12px;
      border: 0;
      border-bottom: 3px solid var(--aaa-blue-dark);
      border-radius: 5px;
      background: var(--aaa-blue);
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: var(--aaa-blue-dark);
    }

    #status {
      min-height: 18px;
      margin-top: 12px;
      color: #b42318;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
    }

    .page-footer {
      padding: 18px 24px;
      color: var(--aaa-muted);
      background: var(--aaa-page);
      font-size: 12px;
      text-align: center;
    }

    .page-footer strong {
      color: var(--aaa-blue);
    }

    .admin-link {
      color: var(--aaa-muted);
      text-decoration: none;
      cursor: pointer;
    }
    
    .admin-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 560px) {
      .aaa-header {
        padding: 14px;
      }

      .header-left {
        gap: 14px;
      }

      .aaa-logo {
        width: 94px;
        min-width: 94px;
        max-height: 54px;
      }

      .header-text h1 {
        font-size: 22px;
      }

      .header-text p {
        margin-top: 5px;
        font-size: 13px;
      }

      .header-status {
        display: none;
      }

      .page-content {
        padding: 20px 10px;
      }

      .container {
        margin: 20px auto;
        padding: 20px;
      }

      .page-footer {
        padding: 14px 10px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <header class="aaa-header">
    <div class="header-left"> 
      <img class="aaa-logo" src="https://lh3.googleusercontent.com/d/1DapvV4CJHEmIOJifIUfCTO5Q1Jq0N9Oh" alt="AAA Smart Home Logo">

      <div class="header-text">
        <h1>NOTE TAKER</h1>
        <p>Note Taking and Scheduling Tool</p>
      </div>
    </div>

    <div class="header-status">
      <span>Secure Agent Access</span>
      <strong>Internal Use Only</strong>
    </div>
  </header>

  <main class="page-content">
    <section class="container">
      <h2>AGENT LOGIN</h2>

      <p class="subtitle">
        Enter your information to begin.
      </p>

      <form id="startForm" onsubmit="return false;">
        <div class="field">
          <label for="name">AGENT NAME</label>
          <input type="text" id="name" required autocomplete="name">
        </div>

        <div class="field">
          <label for="phone">EXTENSION</label>
          <input type="text" id="phone" required autocomplete="off">
        </div>

        <div class="field">
          <label for="dept">DEPARTMENT</label>
          <select id="dept">
            <option value="">Select Department...</option>
            <option value="Tech Support Level 1">Tech Support Level 1</option>
            <option value="Tech Support Level 2">Tech Support Level 2</option>
            <option value="Tech Support Level 3">Tech Support Level 3</option>
          </select>
        </div>

        <button type="button" onclick="saveData()">
          SAVE & CONTINUE
        </button>

        <div id="status"></div>
      </form>
    </section>

    <!-- HIDDEN ADMIN TOOLS SECTION -->
    <section id="adminTools" class="container" style="display: none; margin-top: 0; padding-top: 15px; border-top: 4px solid var(--aaa-muted);">
      <h3 style="margin: 0 0 15px; color: var(--aaa-muted); font-size: 14px; text-align: center;">ADMIN TOOLS</h3>
      
      <div style="display: flex; gap: 10px; justify-content: center;">
        <button type="button" onclick="window.open('https://docs.google.com/document/d/1jxhj_m7IFUa5C9SqFDRCS0C4aZsxXc3tH5CyKiIDtpI/edit?tab=t.0', '_blank')" style="background-color: #f1f3f4; color: var(--aaa-text); border: 1px solid #ccc; border-bottom: 2px solid #bbb; padding: 8px; font-size: 11px;">
          📖 ADMIN GUIDE
        </button>
        
        <button type="button" onclick="window.open('https://docs.google.com/spreadsheets/d/1UdgMgfNU82pXRnC2MP_UsAD-HGxIf2A1h5EFf3-aIWY/edit', '_blank')" style="background-color: #f1f3f4; color: var(--aaa-text); border: 1px solid #ccc; border-bottom: 2px solid #bbb; padding: 8px; font-size: 11px;">
          ⚙️ NOTE TAKER BASE
        </button>
      </div>
    </section>

  </main>

  <footer class="page-footer">
    <strong>AAA Smart Home Security</strong>
    • Note Taker Tool
    • Internal Use Only
    <br><br>
    <a class="admin-link" onclick="promptAdminAccess()">Admin Access</a>
  </footer>

  <!-- CUSTOM ADMIN LOGIN MODAL -->
  <div id="adminLoginModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:999999; align-items:center; justify-content:center; font-family: Arial, sans-serif;">
    <div style="background:#fff; padding:25px; border-radius:8px; width:320px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); text-align: center;">
      <h3 style="margin-top:0; color: var(--aaa-blue);">🔒 Admin Access</h3>
      <p style="font-size: 13px; color: #555; margin-bottom: 15px;">Please enter the admin passcode.</p>
      
      <input type="password" id="adminPasscodeInput" placeholder="Enter Passcode..." style="width: 100%; padding: 10px; margin-bottom: 15px; border: 2px solid #ccc; border-radius: 4px; font-size: 16px; text-align: center;">
      
      <div style="display: flex; gap: 10px; justify-content: center;">
        <button type="button" onclick="closeAdminLogin()" style="padding: 10px 15px; cursor: pointer; background: #eee; border: 1px solid #ccc; border-radius: 4px; width: 50%; color: #333;">Cancel</button>
        <button type="button" id="adminLoginBtn" onclick="verifyAdminPasscode()" style="padding: 10px 15px; cursor: pointer; background: var(--aaa-blue); color: white; border: none; border-radius: 4px; font-weight: bold; width: 50%;">Unlock</button>
      </div>
      
      <div id="adminLoginError" style="margin-top: 15px; font-size: 13px; font-weight: bold; color: var(--aaa-red); display: none;">Incorrect passcode.</div>
    </div>
  </div>

  <script>
    function saveData() {
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const dept = document.getElementById('dept').value.trim();
      const status = document.getElementById('status');

      if (!name || !phone) {
        status.textContent = 'Please enter your Name and Extension.';
        return;
      }

      localStorage.setItem('name', name);
      localStorage.setItem('phone', phone);
      localStorage.setItem('dept', dept);

      window.top.location.href = '<?= appUrl ?>?page=notes';
    }

    window.addEventListener('load', function () {
      document.getElementById('name').value =
        localStorage.getItem('name') || '';

      document.getElementById('phone').value =
        localStorage.getItem('phone') || '';

      document.getElementById('dept').value =
        localStorage.getItem('dept') || '';
    });

    // --- ADMIN ACCESS LOGIC ---
    function promptAdminAccess() {
      document.getElementById('adminLoginModal').style.display = 'flex';
      document.getElementById('adminPasscodeInput').value = '';
      document.getElementById('adminLoginError').style.display = 'none';
      
      setTimeout(() => document.getElementById('adminPasscodeInput').focus(), 100);
    }

    function closeAdminLogin() {
      document.getElementById('adminLoginModal').style.display = 'none';
    }

    function verifyAdminPasscode() {
      const passcode = document.getElementById('adminPasscodeInput').value.trim();
      const errorDiv = document.getElementById('adminLoginError');
      const btn = document.getElementById('adminLoginBtn');
      
      if (!passcode) return;
      
      btn.textContent = "Checking...";
      btn.disabled = true;
      errorDiv.style.display = 'none';
      
      google.script.run
        .withSuccessHandler(function(correctPasscode) {
          btn.textContent = "Unlock";
          btn.disabled = false;
          
          // Force both to be strings and trim spaces just in case
          if (passcode === String(correctPasscode).trim()) {
            document.getElementById('adminLoginModal').style.display = 'none';
            document.getElementById('adminTools').style.display = 'block';
            
            // --- NEW: Bulletproof scrolling method ---
            setTimeout(() => {
              const toolsSection = document.getElementById('adminTools');
              const offsetTop = toolsSection.getBoundingClientRect().top + window.scrollY;
              window.scrollTo({
                top: offsetTop,
                behavior: 'smooth'
              });
            }, 150);
            
          } else {
            errorDiv.style.display = 'block';
            document.getElementById('adminPasscodeInput').value = '';
            document.getElementById('adminPasscodeInput').focus();
          }
        })
        .withFailureHandler(function(error) {
          console.error("Error fetching passcode:", error);
          btn.textContent = "Unlock";
          btn.disabled = false;
          alert("Error connecting to server. Please try again.");
        })
        .getAdminPasscode();
    }

    document.addEventListener('DOMContentLoaded', function() {
      const passField = document.getElementById('adminPasscodeInput');
      if (passField) {
        passField.addEventListener("keypress", function(event) {
          if (event.key === "Enter") {
            event.preventDefault();
            verifyAdminPasscode();
          }
        });
      }
    });
  </script>
</body>
</html>
